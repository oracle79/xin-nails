const NX=[56,110,164,218,272],NY=[215,175,155,177,228],NW=[44,48,50,48,46];
function alm(x,y,w,h){return"M"+(x-w/2)+" "+(y+h)+"L"+(x-w/2)+" "+(y+h*.45)+"Q"+(x-w/2+2)+" "+(y+h*.12)+" "+x+" "+y+"Q"+(x+w/2-2)+" "+(y+h*.12)+" "+(x+w/2)+" "+(y+h*.45)+"L"+(x+w/2)+" "+(y+h)+"Z"}
function art(i){
const G=[["#fff","#cfc9e0","#8a84a6"],null,["#2a1247","#6b3fb8","#e8a8ff"],["#fbf7fb","#efe3ee"],["#ffd1e6","#ff9ac4","#ffd96b"],["#efe6ff","#d9ccff"],["#f8d3d0","#f1b8b8"],["#15101a","#2a2030"]][i];
let d='<defs>',b='';
NX.forEach((x,k)=>{const y=NY[k],w=NW[k],hh=400-y;
let f;
if(i==1){d+='<linearGradient id="a'+i+k+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#fff"/><stop offset=".3" stop-color="#f7d9d2"/><stop offset="1" stop-color="#f4cfc7"/></linearGradient>';}
else{d+='<linearGradient id="a'+i+k+'" x1="0" y1="0" x2="1" y2="1">'+G.map((c,j)=>'<stop offset="'+(j/(G.length-1))+'" stop-color="'+c+'"/>').join("")+'</linearGradient>';}
b+='<path d="'+alm(x,y,w+8,hh)+'" fill="#F1CFC0"/>';
const ny=y+8,nh=[92,118,134,116,90][k],nw=w;
b+='<path d="'+alm(x,ny,nw,nh)+'" fill="url(#a'+i+k+')"/>';
const cx=x,cy=ny+nh*.5;
if(i==2)b+='<path d="M'+(x-nw/2+6)+' '+(ny+nh*.75)+'L'+(x+nw/2-4)+' '+(ny+nh*.25)+'" stroke="#fff" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>';
if(i==3)b+='<path d="M'+(x-nw/2)+' '+(ny+nh*.5)+'q10 -14 20 -2t20 -12M'+(x-nw/2+4)+' '+(ny+nh*.8)+'q12 -10 22 0t16 -8" stroke="#8b7b96" stroke-opacity=".6" fill="none" stroke-width="1.6"/>';
if(i==4)for(let s=0;s<9;s++)b+='<circle cx="'+(x-nw/2+6+((s*17+k*7)%(nw-8)))+'" cy="'+(ny+10+((s*29+k*13)%(nh-14)))+'" r="1.7" fill="#fff" fill-opacity=".85"/>';
if(i==5){b+='<g fill="#fff">'+[0,72,144,216,288].map(a=>'<circle cx="'+(cx+6*Math.cos(a*Math.PI/180))+'" cy="'+(cy+6*Math.sin(a*Math.PI/180))+'" r="3.6"/>').join("")+'</g><circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#ffb84d"/>';}
if(i==6){b+='<path d="M'+cx+' '+(cy-9)+'l7 9l-7 9l-7 -9z" fill="#ffe08a" stroke="#c9962b" stroke-width="1"/><circle cx="'+(cx-9)+'" cy="'+(cy+16)+'" r="3" fill="#fff" stroke="#c9962b"/><circle cx="'+(cx+8)+'" cy="'+(cy+21)+'" r="2.4" fill="#ffd0e6" stroke="#c9962b"/>';}
if(i==7)b+='<path d="M'+(x-nw/2+4)+' '+(ny+nh*.55)+'L'+(x+nw/2-4)+' '+(ny+nh*.4)+'M'+(x-nw/2+4)+' '+(ny+nh*.62)+'L'+(x+nw/2-4)+' '+(ny+nh*.47)+'" stroke="#e4b94a" stroke-width="2"/>';
b+='<ellipse cx="'+(x-nw*.18)+'" cy="'+(ny+nh*.3)+'" rx="4" ry="'+nh*.16+'" fill="#fff" fill-opacity=".4"/>';
});
return'<svg viewBox="0 0 320 400" role="img" aria-label="'+t("d"+i)+'" preserveAspectRatio="xMidYMax slice">'+d+'</defs>'+b+'</svg>'}
let g=0;const $=s=>document.querySelector(s),t=k=>T[k][g];

}
